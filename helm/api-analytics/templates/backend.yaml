apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-analytics.fullname" . }}-backend
  labels:
    {{- include "api-analytics.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ include "api-analytics.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "api-analytics.fullname" . }}-backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: {{ include "api-analytics.fullname" . }}-config
            - secretRef:
                name: {{ include "api-analytics.fullname" . }}-secret
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "api-analytics.fullname" . }}-backend
  labels:
    {{- include "api-analytics.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "api-analytics.fullname" . }}-backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "api-analytics.fullname" . }}-backend-hpa
  labels:
    {{- include "api-analytics.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "api-analytics.fullname" . }}-backend
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
