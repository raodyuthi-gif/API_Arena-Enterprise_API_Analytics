name: CD

on:
  push:
    tags: ["v*.*.*"]

env:
  IMAGE_BACKEND: dhanyashreekr/api-analytics-backend
  IMAGE_FRONTEND: dhanyashreekr/api-analytics-frontend

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.ref_name }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.ref_name }}
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > "$HOME/.kube/config"

      - uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install api-analytics ./helm/api-analytics \
            --namespace api-analytics \
            --create-namespace \
            --set backend.image=${{ env.IMAGE_BACKEND }}:${{ github.ref_name }} \
            --set frontend.image=${{ env.IMAGE_FRONTEND }}:${{ github.ref_name }} \
            --set secrets.secretKey=${{ secrets.APP_SECRET_KEY }} \
            --set secrets.jwtSecretKey=${{ secrets.APP_JWT_SECRET_KEY }} \
            --set secrets.postgresPassword=${{ secrets.APP_POSTGRES_PASSWORD }}