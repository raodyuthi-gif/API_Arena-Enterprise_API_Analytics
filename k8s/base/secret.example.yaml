# Template only — copy to secret.yaml, fill in real values, and NEVER commit secret.yaml.
# Prefer `kubectl create secret generic backend-secret --from-literal=...` or an external
# secrets manager (Vault, AWS Secrets Manager, Sealed Secrets) in real deployments.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: api-analytics
type: Opaque
stringData:
  SECRET_KEY: "change-me-to-a-very-long-random-secret-key"
  JWT_SECRET_KEY: "change-me-jwt-secret-256bit"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/api_analytics"
  REDIS_URL: "redis://redis:6379/0"
  POSTGRES_PASSWORD: "postgres"
  GRAFANA_ADMIN_PASSWORD: "admin"
