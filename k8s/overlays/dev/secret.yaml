# Dev-only placeholder secret — fine to use dummy values here since this overlay
# is for local/dev clusters. Never reuse these values in the prod overlay.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  SECRET_KEY: "dev-secret-key-not-for-prod"
  JWT_SECRET_KEY: "dev-jwt-secret-not-for-prod"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/api_analytics"
  REDIS_URL: "redis://redis:6379/0"
  POSTGRES_PASSWORD: "postgres"
  GRAFANA_ADMIN_PASSWORD: "admin"
