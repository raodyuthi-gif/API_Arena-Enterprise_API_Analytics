apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: api-analytics
namePrefix: dev-

resources:
  - ../../base
  - secret.yaml

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: development
      - op: replace
        path: /data/DEBUG
        value: "true"
